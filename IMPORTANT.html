<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Next Date?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Layout: centred column on a soft blush page; one question, three identical boxed answers */
:root {
  --bg: #ececec;
  --card: #ffffff;
  --ink: #1c1c1c;
  --muted: #7d7d7d;
  --accent: #555555;
  --line: #d4d4d4;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  height: 100%;
  box-sizing: border-box;
  max-width: 380px;
  margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#ask, #done { display: grid; gap: 40px; text-align: center; }
#ask[hidden], #done[hidden] { display: none; }
.emoji { font-size: 44px; line-height: 1; margin-bottom: -16px; }
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(48px, 15vw, 64px);
  line-height: 1;
}
h1 i { font-style: normal; }
.answers { display: grid; gap: 12px; }
button {
  font: 500 16px/1.3 var(--sans);
  text-align: center;
  padding: 15px 18px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
  box-sizing: border-box;
  box-shadow: 0 2px 0 var(--line);
}
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#yes:hover { border-color: var(--accent); }
#yes:active { transform: translateY(1px); box-shadow: none; }
.nope {
  transition: left .22s ease-out, top .22s ease-out;
  touch-action: none;
}
.nope.loose { position: fixed; z-index: 5; margin: 0; }
.hint { position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; padding-inline: 24px; font-size: 14px; color: var(--accent); text-align: center; min-height: 1.3em; }

#done { gap: 28px; }
input[type="date"] {
  font: 500 16px var(--sans); color: var(--ink); text-align: center;
  padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card);
  -webkit-appearance: none; appearance: none; min-height: 50px; width: 100%; box-sizing: border-box;
}
input[type="date"]::-webkit-date-and-time-value { text-align: center; }
input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.picked { margin: 0; font-size: 15px; color: var(--muted); min-height: 1.3em; line-height: 1.5; }
[hidden] { display: none !important; }
#placeText {
  font: 500 16px var(--sans); color: var(--ink); text-align: center;
  padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card);
  width: 100%; box-sizing: border-box; margin-top: 8px;
}
body.scroll { overflow: auto; }
body.scroll .wrap { height: auto; min-height: 100%; }
#done .emoji { margin-bottom: -8px; }
#done h1 { font-size: clamp(40px, 12vw, 52px); }
.field { display: grid; gap: 8px; text-align: left; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.map {
  position: relative; width: 100%; aspect-ratio: 340 / 180; max-width: 100%;
  border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card);
}
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.country { fill: #dcdcdc; stroke: #ffffff; stroke-width: .35; vector-effect: non-scaling-stroke; transition: fill .15s; }
.country:hover { fill: #c9c9c9; }
.country.on { fill: var(--ink); }
.map-msg { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted); pointer-events: none; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: grid; gap: 4px; }
.zoom button { width: 30px; height: 30px; padding: 0; border-radius: 8px; font-size: 16px; line-height: 1; box-shadow: none; display: grid; place-items: center; }
#send { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: none; }
#send:disabled { background: var(--card); color: var(--muted); border-color: var(--line); cursor: default; }
#send.busy { color: #fff; background: var(--ink); }
.sent { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }
.sent small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .nope { transition: none; } }
</style>
</head>
<body>

<main class="wrap">
  <section id="ask">
    <h1>Next <i>date</i>?</h1>
    <div class="answers">
      <button id="yes" type="button">Yes! Let's pick a date 🥰</button>
      <button class="nope" id="no2" type="button">No, "platonic" we said...</button>
    </div>
  </section>

  <section id="done" hidden>
    <div class="emoji" aria-hidden="true">😌</div>
    <h1>It's a <i>date</i>!</h1>
    <div class="field">
      <span class="label">When</span>
      <input type="date" id="when" aria-label="Pick a day">
    </div>
    <div class="field">
      <span class="label">Where</span>
      <div class="map" id="map">
        <svg id="world" viewBox="0 0 340 180" role="img" aria-label="World map, tap a country"></svg>
        <p class="map-msg" id="mapmsg">Loading the map…</p>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zout" aria-label="Zoom out">−</button>
        </div>
      </div>
      <input type="text" id="placeText" placeholder="Type a place" aria-label="Type a place" style="display:none">
    </div>
    <p class="picked" id="picked">Pick a day and a place</p>
    <button type="button" id="send" disabled>Send my answer</button>
    <p class="sent" id="sent" hidden></p>
  </section>
</main>
<p class="hint" id="hint" aria-live="polite"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
(function () {
  var hint = document.getElementById('hint');
  var yesBtn = document.getElementById('yes');
  var nopes = [document.getElementById('no2')];
  var lines = ["Nice try 😏", "Too slow! 🏃"];
  var caught = ["Okay, you got it… but it doesn't count 😌", "Wrong answer, try again 💘"];
  var tries = 0;

  function say() {}

  function detach(btn) {
    if (btn.classList.contains('loose')) return;
    var r = btn.getBoundingClientRect();
    // Keep an invisible spacer where the button was, so the question and "Yes" don't move
    var spacer = document.createElement('div');
    spacer.style.height = r.height + 'px';
    spacer.setAttribute('aria-hidden', 'true');
    btn.parentNode.insertBefore(spacer, btn);
    btn.style.width = r.width + 'px';
    btn.style.left = r.left + 'px';
    btn.style.top = r.top + 'px';
    btn.classList.add('loose');
    void btn.offsetWidth;
  }

  function overlaps(a, b, m) {
    return a.left < b.right + m && a.right > b.left - m && a.top < b.bottom + m && a.bottom > b.top - m;
  }

  // Slide a little away from the point (px, py), in the opposite direction
  function nudge(btn, px, py) {
    detach(btn);
    var r = btn.getBoundingClientRect();
    var w = r.width, h = r.height, pad = 12;
    var cx = r.left + w / 2, cy = r.top + h / 2;
    var dx = cx - px, dy = cy - py;
    // Scale so a horizontal and a vertical push feel the same on a wide button
    dx /= w / 2; dy /= h / 2;
    var len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    if (Math.abs(dx) < .05 && Math.abs(dy) < .05) { dy = 1; }

    var others = [yesBtn.getBoundingClientRect()];
    nopes.forEach(function (o) { if (o !== btn) others.push(o.getBoundingClientRect()); });

    function place(sx, sy) {
      // step just big enough that the pointer ends up outside the button, plus a small margin
      var step = 0, x, y;
      for (var k = 0; k < 40; k++) {
        step += 10;
        x = r.left + sx * step * (w / h > 2 ? .8 : 1);
        y = r.top + sy * step;
        if (px < x - 70 || px > x + w + 70 || py < y - 70 || py > y + h + 70) break;
      }
      x = Math.min(Math.max(pad, x), innerWidth - w - pad);
      y = Math.min(Math.max(pad, y), innerHeight - h - pad - 50);
      var box = { left: x, top: y, right: x + w, bottom: y + h };
      var stillUnder = px >= x - 4 && px <= x + w + 4 && py >= y - 4 && py <= y + h + 4;
      var hits = others.some(function (o) { return overlaps(box, o, 6); });
      return { x: x, y: y, ok: !stillUnder && !hits };
    }

    var tries2 = [[dx, dy], [dx, -dy], [-dx, dy], [0, dy >= 0 ? 1 : -1], [0, dy >= 0 ? -1 : 1], [-dx, -dy]];
    var p;
    for (var i = 0; i < tries2.length; i++) {
      p = place(tries2[i][0], tries2[i][1]);
      if (p.ok) break;
    }
    btn.style.left = p.x + 'px';
    btn.style.top = p.y + 'px';
    say(lines, tries);
    tries++;
  }

  nopes.forEach(function (b) {
    // Computer: only when the mouse actually enters the button
    b.addEventListener('mouseenter', function (e) { nudge(b, e.clientX, e.clientY); });
    b.addEventListener('mousemove', function (e) { nudge(b, e.clientX, e.clientY); });
    // Phone: the finger lands on it, it slides out from under the finger
    b.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var t = e.touches[0];
      nudge(b, t.clientX, t.clientY);
    }, { passive: false });
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('focus', function () {
      b.blur();
      var r = b.getBoundingClientRect();
      nudge(b, r.left + r.width / 2, r.top);
    });
    // If a click ever gets through anyway
    b.addEventListener('click', function (e) {
      e.preventDefault();
      say(caught, Math.floor(Math.random() * caught.length));
      nudge(b, e.clientX || 0, e.clientY || 0);
    });
  });

  addEventListener('resize', function () {
    nopes.forEach(function (b) {
      if (!b.classList.contains('loose')) return;
      var r = b.getBoundingClientRect();
      b.style.left = Math.max(12, Math.min(r.left, innerWidth - r.width - 12)) + 'px';
      b.style.top = Math.max(12, Math.min(r.top, innerHeight - r.height - 12)) + 'px';
    });
  });

  yesBtn.addEventListener('click', function () {
    document.getElementById('ask').hidden = true;
    nopes.forEach(function (b) { b.remove(); });
    hint.textContent = '';
    document.getElementById('done').hidden = false;
    document.body.classList.add('scroll');
    var t = new Date(); t.setDate(t.getDate() + 1);
    document.getElementById('when').min = t.toISOString().slice(0, 10);
  });

  var chosenDay = '', chosenPlace = '';
  var picked = document.getElementById('picked');
  var send = document.getElementById('send');

  function refresh() {
    if (chosenDay && chosenPlace) {
      picked.textContent = chosenPlace + ' · ' + chosenDay;
      picked.style.color = 'var(--ink)';
    } else if (chosenDay) {
      picked.textContent = chosenDay + ' · now pick a place';
    } else if (chosenPlace) {
      picked.textContent = chosenPlace + ' · now pick a day';
    }
    send.disabled = !(chosenDay && chosenPlace);
  }

  document.getElementById('when').addEventListener('change', function (e) {
    var v = e.target.value;
    chosenDay = v ? new Date(v + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
    refresh();
  });

  // World map: tap a country to choose it
  var mapReady = false;
  var mapTries = 0;
  function mapFailed(why) {
    var msg = document.getElementById('mapmsg');
    if (msg) { msg.textContent = "The map couldn't load (" + why + ")"; msg.style.display = 'grid'; }
    var alt = document.getElementById('placeText');
    if (alt) alt.style.display = 'block';
  }
  function buildMap() {
    if (mapReady) return;
    var missing = !window.d3 ? 'd3' : !window.topojson ? 'topojson' : !window.Datamap ? 'datamaps' : !Datamap.prototype.worldTopo ? 'world data' : '';
    if (missing) {
      // libraries may still be arriving: retry for a few seconds before giving up
      if (mapTries++ < 20) { setTimeout(buildMap, 250); return; }
      mapFailed(missing + ' missing');
      return;
    }
    mapReady = true;
    try { drawMap(); } catch (err) { mapReady = false; mapFailed(err && err.message ? err.message : 'error'); }
  }
  function drawMap() {
    var msg = document.getElementById('mapmsg');
    var topo = Datamap.prototype.worldTopo;
    var key = Object.keys(topo.objects)[0];
    var countries = topojson.feature(topo, topo.objects[key]).features
      .filter(function (f) { return f.id !== 'ATA' && f.properties && f.properties.name !== 'Antarctica'; });
    var svg = d3.select('#world');
    var projection = d3.geoNaturalEarth1().fitExtent([[6, 6], [334, 174]], { type: 'FeatureCollection', features: countries });
    var path = d3.geoPath(projection);
    var g = svg.append('g');
    var paths = g.selectAll('path').data(countries).enter().append('path')
      .attr('class', 'country').attr('d', path);
    msg.style.display = 'none';
    var pin = g.append('g').attr('class', 'pinmark').style('display', 'none');
    pin.append('circle').attr('r', 4).attr('fill', '#ffffff').attr('stroke', '#1c1c1c').attr('stroke-width', 1.5);
    var k = 1;

    var zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0, 0], [340, 180]])
      .on('zoom', function (e) {
        k = e.transform.k;
        g.attr('transform', e.transform);
        pin.select('circle').attr('r', 4 / k).attr('stroke-width', 1.5 / k);
      });
    svg.call(zoom);
    document.getElementById('zin').addEventListener('click', function () { svg.transition().duration(250).call(zoom.scaleBy, 1.8); });
    document.getElementById('zout').addEventListener('click', function () { svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.8); });

    svg.on('click', function (e) {
      if (send.classList.contains('busy')) return;
      var pt = d3.pointer(e, g.node());
      var ll = projection.invert(pt);
      if (!ll) return;
      var hit = null;
      for (var i = 0; i < countries.length; i++) {
        if (d3.geoContains(countries[i], ll)) { hit = countries[i]; break; }
      }
      paths.classed('on', function (d) { return d === hit; });
      pin.style('display', null).attr('transform', 'translate(' + pt[0] + ',' + pt[1] + ')');
      pin.raise();
      chosenPlace = hit ? '📍 ' + hit.properties.name : '🌊 Somewhere in the ocean';
      refresh();
    });
  }
  document.getElementById('yes').addEventListener('click', function () { setTimeout(buildMap, 0); });
  document.getElementById('placeText').addEventListener('input', function (e) {
    var v = e.target.value.trim();
    chosenPlace = v ? '📍 ' + v : '';
    refresh();
  });
  addEventListener('load', function () { if (!document.getElementById('done').hidden) buildMap(); });

  // Pretend to send the answer
  send.addEventListener('click', function () {
    if (send.disabled) return;
    send.disabled = true;
    send.classList.add('busy');
    var dots = 0;
    send.textContent = 'Sending';
    var timer = setInterval(function () {
      dots = (dots + 1) % 4;
      send.textContent = 'Sending' + '...'.slice(0, dots);
    }, 300);
    setTimeout(function () {
      clearInterval(timer);
      send.textContent = 'Sent ✓';
      var s = document.getElementById('sent');
      s.innerHTML = 'Answer received<small>Take a screenshot and send it to me too, just in case lol</small>';
      s.hidden = false;
      document.getElementById('when').disabled = true;
    }, 1800);
  });
})();
</script>
</body>
</html>
